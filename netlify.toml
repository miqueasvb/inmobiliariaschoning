[build]
  publish = "."            # carpeta donde están index.html, propiedades.html, css/, js/, img/ ...

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

# Fotos subidas desde el panel. Si existe un archivo real con ese nombre, Netlify lo sirve primero.
[[redirects]]
  from = "/img/propiedades/*"
  to = "/.netlify/functions/img?f=:splat"
  status = 200

# Que el código del backend no se pueda descargar como archivo público
[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/package.json"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/package-lock.json"
  to = "/404.html"
  status = 404
  force = true
[[redirects]]
  from = "/netlify.toml"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"
